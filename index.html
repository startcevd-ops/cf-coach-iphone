function home(){let p=profile(),pl=plan(),L=logs(),done=pl.filter(w=>L[w.id]?.done).length,w=pl[Math.min(done,pl.length-1)],pr=progMeta(p.program),ca=coachAdvice(),pctAdj=Math.round((ca.factor-1)*1000)/10,weekDone=pl.filter(x=>L[x.id]?.done&&x.week===w.week).length;return `${topbar('CF Coach','сила · техника · выносливость')}<div class="hero"><div class="eyebrow">Текущий цикл</div><h1>${esc(pr.full)}</h1><div class="sub">${LEVELS[p.level].name} · ${pr.freq} тренировки/нед · выполнено ${done}/${pl.length}</div><div class="sport-pills"><span class="sport-pill">🏋️ СИЛА</span><span class="sport-pill">🤸 ГИМНАСТИКА</span><span class="sport-pill">⚡ МЕТКОН</span></div><div class="progress" style="margin:14px 0"><i style="width:${Math.round(done/pl.length*100)}%"></i></div><div class="row"><button class="btn" data-workout="${w.id}">▶ Начать тренировку</button><button class="btn secondary" data-tabgo="builder">＋ Свой WOD</button></div></div><div class="grid2"><div class="metric"><strong>${done}</strong><span class="muted">🏆 тренировок выполнено</span></div><div class="metric"><strong>${weekDone}/${pr.freq}</strong><span class="muted">🔥 на этой неделе</span></div></div><div class="coachbox ${ca.tone}" style="margin-top:11px"><div class="eyebrow">Умный тренер ${pctAdj?`· ${pctAdj>0?'+':''}${pctAdj}%`:''}</div><h2>${ca.title}</h2><div class="sub">${ca.text}</div></div><div class="card"><div class="eyebrow">Следующая тренировка</div><h2 style="margin-top:5px">Неделя ${w.week} · день ${w.day}</h2><div class="sub" style="font-weight:800;color:var(--text)">${esc(w.focus)}</div><div class="block-card strength"><div class="section-kicker strength">🏋️ СИЛА</div>${esc(scaled(w.strength))}</div><div class="block-card metcon"><div class="section-kicker metcon">⚡ МЕТКОН</div>${esc(scaled(w.metcon))}</div><div class="row" style="margin-top:11px"><button class="btn" data-workout="${w.id}">Открыть полностью</button><button class="btn secondary" data-tabgo="timer">⏱ Таймер</button></div></div> function programs(){let p=profile(),rec=recommend(p);return `${topbar('Программы','4 отдельных тренировочных цикла')}<div class="card"><h2>Автоподбор</h2><div class="sub">По уровню ${LEVELS[p.level].name}, частоте ${p.freq}×/нед и доступному оборудованию.</div><div class="recommend"><div class="rating">РЕКОМЕНДАЦИЯ</div><h2>${progMeta(rec).full}</h2><div class="sub">${progMeta(rec).desc}</div><button class="btn good" data-program="${rec}">Выбрать рекомендованную</button></div></div>${PROGRAMS.map(pr=>`<div class="program ${p.program===pr.id?'active':''}"><div class="eyebrow">${pr.weeks} недель · ${pr.freq}×/нед</div><h2>${pr.full}</h2><div class="sub">${pr.desc}</div><div class="chips"><span class="chip">${pr.goal}</span><span class="chip ${compatibility(pr,p)>=80?'good':'warn'}">оборудование ${compatibility(pr,p)}%</span>${pr.levels.map(l=>`<span class="chip">${LEVELS[l].name}</span>`).join('')}</div><button class="btn ${p.program===pr.id?'secondary':''}" data-program="${pr.id}">${p.program===pr.id?'Выбрана':'Выбрать'}</button><button class="btn secondary" style="margin-left:6px" data-preview="${pr.id}">Посмотреть план</button></div>`).join('')}`}
function previewProgram(id){let pr=progMeta(id),arr=PROGRAM_DATA[id],sh=document.getElementById('sheet'),cur=0,body='';for(const x of arr){if(x.week!==cur){cur=x.week;body+=`<div class="weektitle">НЕДЕЛЯ ${cur}</div>`}body+=`<div class="workout" data-workout="${x.id}"><b>День ${x.day} · ${esc(x.focus)}</b><div class="muted">${esc(scaled(x.metcon))}</div></div>`}sh.innerHTML=`<div class="sheethead"><div><div class="eyebrow">${pr.weeks} недель</div><h2>${pr.full}</h2></div><button class="close">×</button></div>${body}`;openSheet();sh.querySelectorAll('[data-workout]').forEach(x=>x.onclick=()=>workoutModal(x.dataset.workout))}
function workoutModal(id){let w=getWorkout(id);if(!w)return;let L=logs(),l=L[id]||{},sh=document.getElementById('sheet'),tc=timerFromText(w),mv=detectMove(w.strength)||MOVES[0];sh.innerHTML=`<div class="sheethead"><div><div class="eyebrow">Неделя ${w.week} · тренировка ${w.day}</div><h2>${esc(w.focus)}</h2></div><button class="close">×</button></div><div class="card"><div class="block"><b>Разминка</b><br>${esc(scaled(w.warmup))}</div><div class="block"><b>Силовая</b><br>${esc(scaled(w.strength))}</div><div class="block"><b>Второй блок</b><br>${esc(scaled(w.block2))}</div><div class="block"><b>Меткон</b><br>${esc(scaled(w.metcon))}</div></div><div class="row"><button class="btn" data-autotimer="1">⏱ ${tc.mode} — запустить</button><button class="btn secondary" data-tabgo2="timer">Таймер вручную</button></div><div class="card"><h2>Силовой результат</h2><div class="grid2"><div class="field"><label>Упражнение</label><select id="wexercise">${MOVES.slice(0,8).map(m=>`<option value="${m.id}" ${m.id===mv.id?'selected':''}>${m.name}</option>`).join('')}</select></div><div class="field"><label>Вес, кг</label><input id="wweight" type="number" step="0.5" value="${esc(l.weight||'')}" placeholder="60"></div><div class="field"><label>Повторов в подходе</label><input id="wreps" type="number" min="1" max="30" value="${esc(l.reps||'')}" placeholder="5"></div><div class="field"><label>RPE (1–10)</label><input id="wrpe" type="number" min="1" max="10" value="${esc(l.rpe||'')}" placeholder="7"></div></div><label class="switchrow"><span><b>Сделать новым рабочим весом</b><div class="mini-note">Обновит персональный профиль нагрузки для этого движения.</div></span><input id="wsetbase" type="checkbox"></label></div><div class="card"><h2>Самочувствие</h2><div class="grid2"><div class="field"><label>Готовность 1–5</label><input id="wready" type="number" min="1" max="5" value="${esc(l.readiness||'')}" placeholder="4"></div><div class="field"><label>Боль / дискомфорт 0–10</label><input id="wdiscomfort" type="number" min="0" max="10" value="${esc(l.discomfort||'')}" placeholder="0"></div></div><div class="field"><label>Результат / раунды / время</label><input id="wresult" value="${esc(l.result||'')}" placeholder="например: 5 раундов + 12"></div><div class="field"><label>Комментарий</label><textarea id="wcomment">${esc(l.comment||'')}</textarea></div><button class="btn good" style="width:100%" data-savework="1">Сохранить и завершить</button></div><div class="card"><h2>Техника</h2>${techFor(w).map(e=>`<div class="tech"><b>${esc(e.name)}</b>${e.img?`<img src="${e.img}" alt="${esc(e.name)}">`:''}<div class="muted">${esc(e.cue)}</div></div>`).join('')||'<span class="muted">Подсказки пока не найдены.</span>'}</div><div class="notice">${esc(w.rule||'')}</div>`;openSheet();sh.querySelector('[data-tabgo2]').onclick=()=>{closeSheet();tab='timer';render()};sh.querySelector('[data-autotimer]').onclick=()=>{closeSheet();timer.mode=tc.mode;timer.cycle=tc.cycle;timer.total=tc.total;timer.remain=tc.total;timer.prompts=[];timer.label=w.focus;tab='timer';render();setTimeout(startTimer,120)};sh.querySelector('[data-savework]').onclick=()=>{let rpe=+document.getElementById('wrpe').value||0,dis=+document.getElementById('wdiscomfort').value||0,ready=+document.getElementById('wready').value||0,weight=+document.getElementById('wweight').value||0,reps=+document.getElementById('wreps').value||0,exercise=document.getElementById('wexercise').value,sug=dis>=4?'Снизить нагрузку и не прогрессировать через боль/дискомфорт.':rpe&&rpe<=7&&ready>=4?'Можно умеренно прогрессировать на следующей похожей тренировке.':rpe>=9?'Повтори вес или снизь нагрузку на 5–10%.':'Оставь текущую прогрессию и оцени следующую тренировку по технике и RPE.';L[id]={done:true,result:document.getElementById('wresult').value,rpe,readiness:ready,discomfort:dis,comment:document.getElementById('wcomment').value,suggestion:sug,weight,reps,exercise,savedAt:new Date().toISOString()};jset(LOG,L);if(weight>0&&reps>0)addPerformance({workoutId:id,exercise,weight,reps,rpe,discomfort:dis});if(document.getElementById('wsetbase').checked&&weight>0){let ww=weights();ww[exercise]=weight;saveWeights(ww)}closeSheet();render()}}
function builder(){let b=builderDraft(),templates=builderTemplates();let cycleMap={EMOM:60,E2MOM:120,E3MOM:180,E4MOM:240};let cycle=cycleMap[b.format]||0,rounds=cycle?Math.max(1,Math.ceil((b.minutes*60)/cycle)):b.rounds;return `${topbar('Конструктор','собери тренировку и запусти голосовой таймер')}<div class="card"><h2>1. Формат</h2><div class="segment">${['EMOM','E2MOM','E3MOM','E4MOM','AMRAP','FORTIME','INTERVALS'].map(x=>`<button data-bformat="${x}" class="${b.format===x?'active':''}">${x==='FORTIME'?'FOR TIME':x}</button>`).join('')}</div><div class="grid2"><div class="field"><label>Название</label><input id="bname" value="${esc(b.name)}"></div>${b.format==='INTERVALS'?`<div class="field"><label>Раундов</label><input id="brounds" type="number" min="1" max="50" value="${b.rounds}"></div><div class="field"><label>Работа, сек</label><input id="bwork" type="number" min="5" value="${b.work}"></div><div class="field"><label>Отдых, сек</label><input id="brest" type="number" min="0" value="${b.rest}"></div>`:`<div class="field"><label>${b.format==='FORTIME'?'Лимит':'Длительность'}, мин</label><input id="bminutes" type="number" min="1" max="180" value="${b.minutes}"></div>`}</div><div class="notice">${formatHelp(b.format)}</div></div><div class="card"><h2>2. Добавь упражнения</h2><div class="field"><label>Поиск / выбор</label><select id="bexselect">${BUILDER_EX.map(e=>`<option value="${e.id}">${e.name} · ${e.cat}</option>`).join('')}</select></div><button class="btn secondary" style="width:100%" id="badd">+ Добавить упражнение</button><div id="bitems">${builderItems(b)}</div></div><div class="card"><h2>3. Голос в наушниках</h2><div class="voice-preview">${voicePreview(b).map((x,i)=>`<div class="block"><b>Раунд ${i+1}</b><br>${esc(x)}</div>`).join('')||'Добавь упражнения — здесь появится сценарий озвучки.'}</div><div class="row"><button class="btn secondary" id="btestvoice">🔊 Тест голоса</button><button class="btn good" id="bstart">▶ Запустить</button></div></div><div class="card"><h2>Шаблоны</h2><div class="row"><button class="btn secondary" id="bsave">Сохранить текущую</button><button class="btn secondary" id="bclear">Очистить</button></div>${templates.length?templates.map((t,i)=>`<div class="saved-template"><b>${esc(t.name)}</b><div class="muted">${t.format} · ${t.items.length} упражн.</div><div class="row" style="margin-top:7px"><button class="btn secondary" data-bload="${i}">Открыть</button><button class="btn danger" data-bdel="${i}">Удалить</button></div></div>`).join(''):'<div class="muted" style="margin-top:10px">Сохранённых шаблонов пока нет.</div>'}</div>`}
function builderItems(b){if(!b.items.length)return '<div class="muted" style="margin-top:10px">Добавь упражнения в нужном порядке.</div>';return b.items.map((it,i)=>`<div class="builder-item"><input data-btext="${i}" value="${esc(it.text)}"><div class="mini-actions"><button data-bup="${i}">↑</button><button data-bdown="${i}">↓</button><button data-bremove="${i}">×</button></div></div>`).join('')}
function formatHelp(f){return ({EMOM:'Каждую минуту начинается новый раунд; остаток минуты — отдых.',E2MOM:'Новый раунд каждые 2 минуты.',E3MOM:'Новый раунд каждые 3 минуты.',E4MOM:'Новый раунд каждые 4 минуты.',AMRAP:'Максимум раундов/повторений за заданное время. Голос озвучит старт и финальные 10 секунд.',FORTIME:'Выполни заданный объём как можно быстрее; таймер считает вверх до лимита.',INTERVALS:'Настраиваемые интервалы работа/отдых по раундам.'})[f]||''}
function voicePreview(b){if(!b.items.length)return [];let cycleMap={EMOM:60,E2MOM:120,E3MOM:180,E4MOM:240};if(cycleMap[b.format]){let n=Math.ceil((b.minutes*60)/cycleMap[b.format]);return Array.from({length:Math.min(n,8)},(_,i)=>b.items[i%b.items.length].text)}if(b.format==='INTERVALS')return Array.from({length:Math.min(b.rounds,8)},(_,i)=>b.items[i%b.items.length].text);return [b.items.map(x=>x.text).join('. ')]}
function buildTimerConfig(b){let cycleMap={EMOM:60,E2MOM:120,E3MOM:180,E4MOM:240},cfg={mode:b.format,voice:true,sound:true,roundPrompts:[]};if(cycleMap[b.format]){cfg.cycleSeconds=cycleMap[b.format];cfg.totalSeconds=b.minutes*60;let n=Math.ceil(cfg.totalSeconds/cfg.cycleSeconds);cfg.roundPrompts=Array.from({length:n},(_,i)=>b.items[i%b.items.length]?.text||'')}else if(b.format==='AMRAP'){cfg.totalSeconds=b.minutes*60;cfg.startPrompt=b.items.map(x=>x.text).join('. ')}else if(b.format==='FORTIME'){cfg.capSeconds=b.minutes*60;cfg.startPrompt=b.items.map(x=>x.text).join('. ')}else{cfg.workSeconds=b.work;cfg.restSeconds=b.rest;cfg.rounds=b.rounds;cfg.roundPrompts=Array.from({length:b.rounds},(_,i)=>b.items[i%b.items.length]?.text||'')}return cfg}
function timers(){return `${topbar('Таймер','выбери формат · включайся · работай')}<div class="card"><div class="eyebrow">WOD TIMER</div><h2 style="margin-top:5px">Режим тренировки</h2><div class="timerpresets">${[['EMOM',60,600],['E2MOM',120,600],['E3MOM',180,900],['E4MOM',240,960],['AMRAP',0,720],['TABATA',0,240]].map(x=>`<button data-tpreset="${x[0]}|${x[1]}|${x[2]}" class="${timer.mode===x[0]?'active':''}">${x[0]}</button>`).join('')}</div><div class="timerface" id="time">${timerDisplay()}</div>${timer.label?`<div class="notice" style="margin-bottom:10px"><b>${esc(timer.label)}</b>${timer.prompts?.length?'<br>Раунды будут озвучиваться по упражнениям.':''}</div>`:''}<div class="row"><button class="btn" id="tstart">${timer.running?'Пауза':'Старт'}</button><button class="btn secondary" id="treset">Сброс</button></div></div><div class="card"><h2>Форматы</h2><div class="block"><b>EMOM</b> — каждую минуту начинай заданный объём; остаток минуты — отдых.</div><div class="block"><b>E2MOM / E3MOM / E4MOM</b> — новый подход каждые 2 / 3 / 4 минуты.</div><div class="block"><b>AMRAP</b> — максимум раундов или повторений за заданное время.</div><div class="block"><b>TABATA 20/10</b> — 20 секунд работа, 10 секунд отдых, 8 раундов.</div><div class="notice">Android-таймер продолжает работать при выключенном экране. Из конструктора он умеет озвучивать не только номер раунда, но и само задание.</div></div>`}

function recipesHtml(){return `<div class="card"><h2>Простые и ПП рецепты</h2><div class="field"><label>Фильтр</label><select id="recipefilter"><option value="all">Все рецепты</option><option value="быстро">Быстро</option><option value="высокобелковое">Высокобелковые</option><option value="завтрак">Завтраки</option><option value="обед">Обеды</option><option value="ужин">Ужины</option></select></div><div id="recipelist">${recipeList('all')}</div></div>`}

function recipeModal(id){let r=RECIPES.find(x=>x.id===id);if(!r)return;let sh=document.getElementById('sheet');sh.innerHTML=`<div class="sheethead"><div><div class="eyebrow">Рецепт</div><h2>${esc(r.name)}</h2></div><button class="close">×</button></div><div class="grid2" style="margin-top:12px"><div class="metric"><strong>${r.kcal}</strong><span class="muted">ккал / порция</span></div><div class="metric"><strong>${r.p}/${r.f}/${r.c}</strong><span class="muted">Б / Ж / У, г</span></div></div><div class="card"><h2>Ингредиенты</h2>${r.ingredients.map(x=>`<div class="ingredient">${esc(x)}</div>`).join('')}</div><div class="card"><h2>Приготовление</h2>${r.steps.map((x,i)=>`<div class="ingredient"><b>${i+1}.</b> ${esc(x)}</div>`).join('')}</div><div class="card"><div class="grid2"><div class="field"><label>Порций</label><input id="rserv" type="number" min="0.5" max="5" step="0.5" value="1"></div><div class="field"><label>Приём пищи</label><select id="rmeal"><option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Перекус</option></select></div></div><button class="btn good" style="width:100%" id="radd">Добавить в дневник</button></div>`;openSheet();document.getElementById('radd').onclick=()=>{let q=+document.getElementById('rserv').value||1;addFoodEntry({meal:document.getElementById('rmeal').value,name:r.name,kcal:r.kcal*q,p:r.p*q,f:r.f*q,c:r.c*q});closeSheet();foodTab='diary';render()}}

function customFoodModal(){let sh=document.getElementById('sheet');sh.innerHTML=`<div class="sheethead"><h2>Добавить продукт / блюдо</h2><button class="close">×</button></div><div class="field"><label>Название</label><input id="cfname" placeholder="Например: суп"></div><div class="field"><label>Приём пищи</label><select id="cfmeal"><option>Завтрак</option><option>Обед</option><option>Ужин</option><option>Перекус</option></select></div><div class="grid2"><div class="field"><label>Ккал</label><input id="cfk" type="number"></div><div class="field"><label>Белок, г</label><input id="cfp" type="number"></div><div class="field"><label>Жиры, г</label><input id="cff" type="number"></div><div class="field"><label>Углеводы, г</label><input id="cfc" type="number"></div></div><button class="btn good" style="width:100%" id="cfsave">Добавить</button>`;openSheet();document.getElementById('cfsave').onclick=()=>{addFoodEntry({meal:document.getElementById('cfmeal').value,name:document.getElementById('cfname').value||'Без названия',kcal:+document.getElementById('cfk').value||0,p:+document.getElementById('cfp').value||0,f:+document.getElementById('cff').value||0,c:+document.getElementById('cfc').value||0});closeSheet();render()}}
function calcFood(){let s=foodSettings(),sex=document.getElementById('sex').value,a=+document.getElementById('age').value,h=+document.getElementById('height').value,w=+document.getElementById('weight').value,act=+document.getElementById('activity').value,t=document.getElementById('target').value;if(!a||!h||!w){document.getElementById('calcres').innerHTML='<div class="notice" style="margin-top:10px">Заполни возраст, рост и вес.</div>';return}let bmr=10*w+6.25*h-5*a+(sex==='m'?5:-161),k=bmr*act;if(t==='cut')k*=.85;if(t==='gain')k*=1.10;let p=Math.round(w*1.8),f=Math.round(w*.8),c=Math.max(0,Math.round((k-p*4-f*9)/4));s={sex,age:a,height:h,weight:w,activity:act,target:t,kcal:Math.round(k),p,f,c};saveFoodSettings(s);document.getElementById('calcres').innerHTML=`<div class="grid2" style="margin-top:12px"><div class="metric"><strong>${s.kcal}</strong><span class="muted">ккал/день</span></div><div class="metric"><strong>${p}/${f}/${c}</strong><span class="muted">Б / Ж / У, г</span></div></div><div class="notice" style="margin-top:8px">Цель сохранена в дневнике питания.</div>`}
function aiHistory(){return jget(AIKEY,[])}function saveAiHistory(x){jset(AIKEY,x.slice(-60))}
function aiStats(){let arr=recentTrainingLogs(5),r=arr.map(x=>+x.l.rpe).filter(Boolean),d=arr.map(x=>+x.l.discomfort).filter(x=>!isNaN(x)),en=arr.map(x=>+x.l.readiness).filter(Boolean),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,p=profile(),pl=plan(),L=logs(),done=pl.filter(w=>L[w.id]?.done).length,next=pl[Math.min(done,pl.length-1)]||pl[pl.length-1],s=foodSettings(),fd=foodDiary()[todayISO()]||[],eaten=fd.reduce((a,x)=>a+(+x.kcal||0),0);return {p,arr,avgRpe:avg(r),avgPain:avg(d),avgReady:avg(en),done,total:pl.length,next,weights:weights(),foodTarget:s.kcal||0,foodToday:Math.round(eaten),advice:coachAdvice(),applied:jget(AIFKEY,null)}}
function aiContextText(){let a=aiStats(),w=a.weights;return `Программа: ${progMeta(a.p.program).full}. Уровень: ${LEVELS[a.p.level].name}. Пройдено: ${a.done}/${a.total}. Средний RPE последних тренировок: ${a.avgRpe==null?'нет данных':a.avgRpe.toFixed(1)}. Дискомфорт: ${a.avgPain==null?'нет данных':a.avgPain.toFixed(1)}/10. Готовность: ${a.avgReady==null?'нет данных':a.avgReady.toFixed(1)}/5. Рабочие веса: присед ${w.squat||'—'}, фронтальный ${w.front||'—'}, становая ${w.deadlift||'—'}, clean ${w.clean||'—'}, рывок ${w.snatch||'—'}, толчок ${w.jerk||'—'} кг. Следующая тренировка: ${a.next?a.next.focus:'—'}. Питание сегодня: ${a.foodToday}${a.foodTarget?' / '+a.foodTarget:''} ккал.`}
function aiGeneralAnalysis(){let a=aiStats(),lines=[],factor=1,title='Сохраняем план';if(a.avgPain!=null&&a.avgPain>=4){factor=.95;title='Нагрузку лучше снизить';lines.push(`Средний дискомфорт ${a.avgPain.toFixed(1)}/10 — это главный ограничитель.`)}else if(a.avgRpe!=null&&a.avgRpe>=9){factor=.95;title='Нужен запас восстановления';lines.push(`Средний RPE ${a.avgRpe.toFixed(1)} — последние сессии были слишком близко к пределу.`)}else if(a.avgRpe!=null&&a.avgRpe<=7&&a.avgReady!=null&&a.avgReady>=4&&(a.avgPain==null||a.avgPain<=2)){factor=1.025;title='Можно слегка прогрессировать';lines.push(`RPE ${a.avgRpe.toFixed(1)}, готовность ${a.avgReady.toFixed(1)}/5 и низкий дискомфорт позволяют небольшой шаг вверх.`)}else{lines.push('Последние данные не требуют дополнительного ускорения или разгрузки.')}
if(a.next)lines.push(`Следующая сессия: ${a.next.focus}. Я бы сохранил структуру и менял только нагрузку.`);if(a.foodTarget&&a.foodToday&&a.foodToday<a.foodTarget*.55)lines.push('По дневнику питания сегодня пока заметный недобор калорий; для тяжёлой тренировки проверь, что это не просто незаполненный дневник.');return {title,text:lines.join('\n'),factor}}
function aiLocalReply(q){let t=String(q||'').toLowerCase().replace(/ё/g,'е'),a=aiStats(),g=aiGeneralAnalysis(),w=a.weights,next=a.next;let factor=null,text='';if(/сегодня|что делать|следующ/.test(t)){text=next?`Следующая тренировка — ${next.focus}.\nСиловая: ${scaled(next.strength)}\nМеткон: ${scaled(next.metcon)}\n\n${g.text}`:'Текущий цикл завершён. Можно перейти к новому блоку или сделать контрольную неделю.';factor=g.factor}else if(/вес|прибав|сниз|нагруз/.test(t)){factor=g.factor;let pct=Math.round((factor-1)*1000)/10;text=`${g.title}. ${g.text}\n\nТекущие ориентиры: присед ${w.squat||'—'} кг, становая ${w.deadlift||'—'} кг, взятие ${w.clean||'—'} кг, рывок ${w.snatch||'—'} кг, толчок ${w.jerk||'—'} кг.`}else if(/восстанов|устал|rpe|боль|плеч/.test(t)){text=`За последние тренировки: RPE ${a.avgRpe==null?'—':a.avgRpe.toFixed(1)}, готовность ${a.avgReady==null?'—':a.avgReady.toFixed(1)}/5, дискомфорт ${a.avgPain==null?'—':a.avgPain.toFixed(1)}/10.\n${g.text}`;factor=g.factor}else if(/пит|калор|бжу|есть/.test(t)){let s=foodSettings();text=s.kcal?`Твоя сохранённая цель: ${s.kcal} ккал, Б ${s.p} / Ж ${s.f} / У ${s.c} г. Сегодня в дневнике ${a.foodToday} ккал. ${a.foodToday<s.kcal*.7?'Если дневник заполнен полностью, до цели заметный недобор.':'По калориям ты близко к плану либо ещё есть запас на день.'}`:'Сначала рассчитай цель во вкладке «Питание → Калькулятор», тогда я смогу сравнивать рацион с планом.'}else if(/рекорд|pr|прогресс|сил/.test(t)){let ps=performances().slice(-8);text=ps.length?`У тебя ${ps.length} последних силовых записей. Лучшие ориентиры сейчас: присед ${w.squat||'—'} кг, становая ${w.deadlift||'—'} кг, взятие ${w.clean||'—'} кг. ${g.title.toLowerCase()}.`:'Пока мало силовых записей. После тренировок сохраняй вес и повторы — тогда я смогу отслеживать e1RM и тренд.'}else if(/выход|muscle|брусь|гнкп|гимнаст/.test(t)){text='Для гимнастики я бы не гнал объём через отказ. Сначала качественные ГНКП/chest-to-bar и брусья, затем 3–6 технических попыток выхода силой с большим отдыхом. Если техника разваливается — переходи обратно к прогрессиям.'}else{text=`Я вижу твой профиль и журнал. ${g.title}.\n${g.text}\n\nМожешь спросить: «Что делать сегодня?», «Поднять ли веса?», «Как восстановление?», «Что по питанию?», «Как идёт прогресс?»`;factor=g.factor}return {text,factor}}
async function aiReply(q){let p=profile(),endpoint=(p.aiEndpoint||'').trim();if(endpoint){try{let r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,context:aiContextText(),profile:p})});if(r.ok){let j=await r.json();let text=j.reply||j.message||j.text;if(text)return {text,factor:typeof j.factor==='number'?j.factor:null,cloud:true}}}catch(e){}}return aiLocalReply(q)}
function ai(){let h=aiHistory(),a=aiStats(),g=aiGeneralAnalysis(),adj=jget(AIFKEY,null),pct=Math.round((g.factor-1)*1000)/10;return `${topbar('AI Coach','тренер-аналитик по твоим данным')}<div class="aihero"><span class="aibadge">✦ AI COACH · локальный анализ</span><h2 style="margin:9px 0 5px">${g.title}</h2><div class="sub">${esc(g.text)}</div>${g.factor!==1?`<button class="btn aiapply" data-aiapply="${g.factor}">Применить ${pct>0?'+':''}${pct}% на 7 дней</button>`:''}${adj?`<div class="mini-note" style="margin-top:8px">Активна ручная AI-коррекция: ${Math.round((adj.factor-1)*1000)/10}% · до ${new Date(adj.expires).toLocaleDateString('ru-RU')} · <button class="techbtn" data-aireset="1">сбросить</button></div>`:''}</div><div class="aisnapshot"><div class="metric"><strong>${a.avgRpe==null?'—':a.avgRpe.toFixed(1)}</strong><span class="muted">средний RPE</span></div><div class="metric"><strong>${a.avgReady==null?'—':a.avgReady.toFixed(1)}/5</strong><span class="muted">готовность</span></div><div class="metric"><strong>${a.avgPain==null?'—':a.avgPain.toFixed(1)}/10</strong><span class="muted">дискомфорт</span></div><div class="metric"><strong>${a.done}/${a.total}</strong><span class="muted">цикл</span></div></div><div class="card"><div class="aichips"><button data-aiq="Что делать сегодня?">Сегодня</button><button data-aiq="Поднять ли мне веса?">Веса</button><button data-aiq="Как у меня восстановление?">Восстановление</button><button data-aiq="Что по питанию сегодня?">Питание</button><button data-aiq="Как идёт силовой прогресс?">Прогресс</button></div><div class="aimessages" id="aimessages">${h.length?h.map(m=>`<div class="aimsg ${m.role==='user'?'user':'ai'}">${esc(m.text)}${m.factor&&m.role==='ai'?`<button class="btn secondary aiapply" data-aiapply="${m.factor}">Применить корректировку</button>`:''}</div>`).join(''):'<div class="aimsg ai">Привет. Я анализирую журнал CF Coach, рабочие веса, RPE, готовность и питание. Спроси меня о следующей тренировке или нагрузке.</div>'}</div><div class="aicomposer"><textarea id="aiinput" placeholder="Например: стоит ли сегодня делать становую 120 кг?"></textarea><button class="btn" id="aisend">➤</button></div></div><div class="card"><h2>Облачный AI — опционально</h2><div class="mini-note">Локальный аналитик работает без интернета. Для свободного диалога можно позже подключить свой защищённый AI-endpoint; API-ключ в приложение не зашивается.</div><div class="field"><label>AI endpoint</label><input id="aiendpoint" value="${esc(profile().aiEndpoint||'')}" placeholder="https://…/coach"></div><button class="btn secondary" id="aisaveendpoint">Сохранить endpoint</button></div>`}

function bindAI(){document.querySelectorAll('[data-aiq]').forEach(x=>x.onclick=()=>sendAI(x.dataset.aiq));document.querySelectorAll('[data-aiapply]').forEach(x=>x.onclick=()=>applyAiFactor(x.dataset.aiapply));document.querySelectorAll('[data-aireset]').forEach(x=>x.onclick=()=>{localStorage.removeItem(AIFKEY);render()});let s=document.getElementById('aisend');if(s)s.onclick=()=>{let i=document.getElementById('aiinput'),q=i.value.trim();if(q)sendAI(q)};let i=document.getElementById('aiinput');if(i)i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();let q=i.value.trim();if(q)sendAI(q)}};let ep=document.getElementById('aisaveendpoint');if(ep)ep.onclick=()=>{let p=profile();p.aiEndpoint=document.getElementById('aiendpoint').value.trim();saveP(p);render()}}

function prof(){let p=profile(),L=logs(),done=Object.values(L).filter(x=>x.done).length,s=foodSettings(),ww=weights(),ca=coachAdvice(),pr=bestPR(progressExercise),hist=performances().filter(x=>x.exercise===progressExercise).slice(-6).reverse();return `${topbar('Профиль','рабочие веса, PR и адаптация')}<div class="coachbox ${ca.tone}"><div class="eyebrow">Умный тренер</div><h2>${ca.title}</h2><div class="sub">${ca.text}</div></div><div class="card"><h2>Мои рабочие веса</h2><div class="mini-note" style="margin-bottom:10px">Это не обязательно 1ПМ. Укажи комфортный ориентир, от которого CF Coach будет персонализировать веса во всех программах.</div><div class="weightgrid">${MOVES.map(m=>`<label>${m.name}</label><input data-weight="${m.id}" type="number" step="0.5" value="${ww[m.id]||''}">`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" id="saveweights">Сохранить рабочие веса</button></div><div class="card"><h2>Адаптивная нагрузка</h2><label class="switchrow"><span><b>Автокоррекция по последним тренировкам</b><div class="mini-note">Учитывает средний RPE, готовность и боль/дискомфорт последних 3 тренировок.</div></span><input id="padaptive" type="checkbox" ${p.adaptive!==false?'checked':''}></label><div class="notice">Алгоритм меняет рекомендуемые веса небольшими шагами: обычно +2,5%, 0%, −2,5% или −5%. Он не заменяет оценку техники и самочувствия.</div></div><div class="card"><h2>Прогресс силы</h2><div class="field"><label>Упражнение</label><select id="progressExercise">${MOVES.slice(0,8).map(m=>`<option value="${m.id}" ${m.id===progressExercise?'selected':''}>${m.name}</option>`).join('')}</select></div>${chartSvg(progressExercise)}<div class="grid2" style="margin-top:10px"><div class="metric"><strong>${pr?pr.weight+' кг':'—'}</strong><span class="muted">лучший записанный вес</span></div><div class="metric"><strong>${pr?(pr.e1rm||e1rm(pr.weight,pr.reps)).toFixed?Number(pr.e1rm||e1rm(pr.weight,pr.reps)).toFixed(1):pr.e1rm:'—'}</strong><span class="muted">расчётный e1RM, кг</span></div></div>${hist.length?`<div style="margin-top:10px">${hist.map(x=>`<div class="prrow"><div><b>${new Date(x.date).toLocaleDateString('ru-RU')}</b><div class="mini-note">${x.weight} кг × ${x.reps} · RPE ${x.rpe||'—'}</div></div><div class="prvalue">e1RM ${Number(x.e1rm||e1rm(x.weight,x.reps)).toFixed(1)}</div></div>`).join('')}</div>`:''}</div><div class="card"><h2>Оформление</h2><div class="sub" style="margin-bottom:9px">Светлая тема — основная CrossFit Clean. Тёмную можно включить для вечерних тренировок.</div><div class="theme-choice"><button id="themeLight" class="${(p.theme||'light')==='light'?'active':''}">☀️ Светлая</button><button id="themeDark" class="${p.theme==='dark'?'active':''}">🌙 Тёмная</button></div></div><div class="card"><h2>Тренировочный профиль</h2><div class="field"><label>Уровень</label><select id="plevel">${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${p.level===k?'selected':''}>${v.name}</option>`).join('')}</select></div><div class="field"><label>Тренировок в неделю</label><select id="pfreq">${[2,3,4,5].map(x=>`<option value="${x}" ${p.freq==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Цель</label><select id="pgoal"><option value="fitness" ${p.goal==='fitness'?'selected':''}>Общая форма</option><option value="strength" ${p.goal==='strength'?'selected':''}>Сила</option><option value="endurance" ${p.goal==='endurance'?'selected':''}>Выносливость</option><option value="body" ${p.goal==='body'?'selected':''}>Композиция тела</option></select></div><label class="muted">Доступное оборудование</label><div class="equip">${Object.entries(EQUIP).map(([k,v])=>`<label><input type="checkbox" data-equip="${k}" ${(p.equipment||[]).includes(k)?'checked':''}>${v}</label>`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" id="saveprof">Сохранить профиль</button></div><div class="grid2"><div class="metric"><strong>${done}</strong><span class="muted">выполнено всего</span></div><div class="metric"><strong>${s.kcal||'—'}</strong><span class="muted">цель ккал/день</span></div></div><div class="card"><h2>Диагностика beta</h2><div class="block">Версия: <b>7.0 AI beta</b></div><div class="block">Android bridge: <b id="bridgeState">проверка…</b></div><div class="block">Локальное хранилище: <b id="storageState">проверка…</b></div><div class="row"><button class="btn secondary" id="diagVoice">Тест голоса</button><button class="btn secondary" id="diagBeep">Тест сигнала</button></div></div><div class="card"><h2>CF Coach v7.0 AI</h2><div class="block">✓ персональные рабочие веса по основным движениям</div><div class="block">✓ автоматическая персонализация весов программы</div><div class="block">✓ история силовых результатов и расчётный e1RM</div><div class="block">✓ график прогресса</div><div class="block">✓ адаптация нагрузки по RPE, готовности и дискомфорту</div><div class="block">✓ Light CrossFit UI + переключение светлой/тёмной темы</div><div class="block">✓ AI Coach: анализ журнала, чат, применяемая корректировка нагрузки
</div><div class="block">✓ все функции v6.3: Light UI, тяжёлый PERFORMANCE, гимнастика, питание и голосовые таймеры</div></div>`}
function onboarding(){let p=profile(),rec=recommend(p);return `<div class="onboard" id="onboard"><div class="onwrap"><div class="onlogo"><div class="eyebrow">CF COACH</div><h1>Подберём программу</h1><div class="sub">4 вопроса — и приложение предложит подходящий стартовый цикл.</div></div><div class="card"><h2>1. Твой уровень</h2><div class="levelgrid">${Object.entries(LEVELS).map(([k,v])=>`<button class="level ${p.level===k?'active':''}" data-onlevel="${k}"><b>${v.name}</b><small>${v.note}</small></button>`).join('')}</div></div><div class="card"><h2>2. Главная цель</h2><select id="ongoal"><option value="fitness" ${p.goal==='fitness'?'selected':''}>Общая форма</option><option value="strength" ${p.goal==='strength'?'selected':''}>Сила</option><option value="endurance" ${p.goal==='endurance'?'selected':''}>Выносливость</option><option value="body" ${p.goal==='body'?'selected':''}>Композиция тела</option></select></div><div class="card"><h2>3. Сколько тренировок в неделю?</h2><select id="onfreq">${[2,3,4,5].map(x=>`<option value="${x}" ${p.freq==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="card"><h2>4. Что есть в зале?</h2><div class="equip">${Object.entries(EQUIP).map(([k,v])=>`<label><input type="checkbox" data-onequip="${k}" ${(p.equipment||[]).includes(k)?'checked':''}>${v}</label>`).join('')}</div></div><div class="recommend"><div class="rating">РЕКОМЕНДУЕМ</div><h2 id="onrec">${progMeta(rec).full}</h2><div class="sub" id="onrecdesc">${progMeta(rec).desc}</div></div><button class="btn good" style="width:100%" id="onstart">Начать программу</button></div></div>`}
function applyTheme(){let p=profile(),theme=p.theme||'light';document.documentElement.dataset.theme=theme;let meta=document.querySelector('meta[name=theme-color]');if(meta)meta.content=theme==='dark'?'#0c1119':'#f5f7fb';if(window.AndroidCoach&&AndroidCoach.setTheme)try{AndroidCoach.setTheme(theme)}catch(e){}}
function render(){let p=profile();applyTheme();let map={home,programs,builder,timer:timers,food,profile:prof,ai};document.getElementById('app').innerHTML=(map[tab]||home)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));bind();let fab=document.getElementById('aifab');if(fab){fab.style.display=tab==='ai'?'none':'block';fab.onclick=()=>{tab='ai';render()}}let old=document.getElementById('onboard');if(old)old.remove();if(!p.onboarded){document.body.insertAdjacentHTML('beforeend',onboarding());bindOnboard()}}
function bindOnboard(){document.querySelectorAll('[data-onlevel]').forEach(x=>x.onclick=()=>{let p=profile();p.level=x.dataset.onlevel;saveP(p);render()});document.getElementById('ongoal').onchange=e=>{let p=profile();p.goal=e.target.value;saveP(p);render()};document.getElementById('onfreq').onchange=e=>{let p=profile();p.freq=+e.target.value;saveP(p);render()};document.querySelectorAll('[data-onequip]').forEach(x=>x.onchange=()=>{let p=profile();p.equipment=[...document.querySelectorAll('[data-onequip]:checked')].map(z=>z.dataset.onequip);saveP(p);let r=recommend(p);document.getElementById('onrec').textContent=progMeta(r).full;document.getElementById('onrecdesc').textContent=progMeta(r).desc});document.getElementById('onstart').onclick=()=>{let p=profile();p.program=recommend(p);p.onboarded=true;saveP(p);render()}}
function bind(){document.querySelectorAll('[data-tabgo]').forEach(x=>x.onclick=()=>{tab=x.dataset.tabgo;render()});document.querySelectorAll('[data-workout]').forEach(x=>x.onclick=()=>workoutModal(x.dataset.workout));document.querySelectorAll('[data-program]').forEach(x=>x.onclick=()=>{let p=profile();p.program=x.dataset.program;p.onboarded=true;saveP(p);render()});document.querySelectorAll('[data-preview]').forEach(x=>x.onclick=()=>previewProgram(x.dataset.preview));if(tab==='builder')bindBuilder();if(tab==='timer')bindTimer();if(tab==='food')bindFood();if(tab==='ai')bindAI();if(tab==='profile'){let tl=document.getElementById('themeLight'),td=document.getElementById('themeDark');if(tl)tl.onclick=()=>{let p=profile();p.theme='light';saveP(p);applyTheme();render()};if(td)td.onclick=()=>{let p=profile();p.theme='dark';saveP(p);applyTheme();render()};document.getElementById('saveprof').onclick=()=>{let p=profile();p.level=document.getElementById('plevel').value;p.freq=+document.getElementById('pfreq').value;p.goal=document.getElementById('pgoal').value;p.equipment=[...document.querySelectorAll('[data-equip]:checked')].map(x=>x.dataset.equip);p.adaptive=document.getElementById('padaptive').checked;saveP(p);render()};document.getElementById('saveweights').onclick=()=>{let w=weights();document.querySelectorAll('[data-weight]').forEach(x=>{let v=+x.value;if(v>0)w[x.dataset.weight]=v});saveWeights(w);render()};document.getElementById('padaptive').onchange=e=>{let p=profile();p.adaptive=e.target.checked;saveP(p);render()};document.getElementById('progressExercise').onchange=e=>{progressExercise=e.target.value;render()};bindDiagnostics()}}
function bindDiagnostics(){let b=document.getElementById('bridgeState'),s=document.getElementById('storageState');if(b)b.textContent=(window.AndroidCoach?(window.AndroidCoach.__iosPWA?'PWA · iPhone':'OK · native'):'НЕТ');if(s){try{localStorage.setItem('__cf_test','1');localStorage.removeItem('__cf_test');s.textContent='OK'}catch(e){s.textContent='ОШИБКА'}}let v=document.getElementById('diagVoice');if(v)v.onclick=()=>{if(window.AndroidCoach)window.AndroidCoach.speak('CF Coach. Тест голоса. Всё работает.');else alert('Android bridge не найден')};let p=document.getElementById('diagBeep');if(p)p.onclick=()=>{if(window.AndroidCoach)window.AndroidCoach.beep(880,180);else alert('Android bridge не найден')}}
function bindBuilder(){document.querySelectorAll('[data-bformat]').forEach(x=>x.onclick=()=>{let b=builderDraft();b.format=x.dataset.bformat;saveBuilderDraft(b);render()});let ids=['bname','bminutes','brounds','bwork','brest'];ids.forEach(id=>{let e=document.getElementById(id);if(e)e.onchange=()=>{let b=builderDraft();if(id==='bname')b.name=e.value;else if(id==='bminutes')b.minutes=Math.max(1,+e.value||1);else if(id==='brounds')b.rounds=Math.max(1,+e.value||1);else if(id==='bwork')b.work=Math.max(5,+e.value||5);else if(id==='brest')b.rest=Math.max(0,+e.value||0);saveBuilderDraft(b);render()}});document.getElementById('badd').onclick=()=>{let b=builderDraft(),id=document.getElementById('bexselect').value,e=BUILDER_EX.find(x=>x.id===id);b.items.push({id,text:e.default});saveBuilderDraft(b);render()};document.querySelectorAll('[data-btext]').forEach(x=>x.onchange=()=>{let b=builderDraft();b.items[+x.dataset.btext].text=x.value;saveBuilderDraft(b);render()});document.querySelectorAll('[data-bremove]').forEach(x=>x.onclick=()=>moveBuilder(+x.dataset.bremove,'remove'));document.querySelectorAll('[data-bup]').forEach(x=>x.onclick=()=>moveBuilder(+x.dataset.bup,'up'));document.querySelectorAll('[data-bdown]').forEach(x=>x.onclick=()=>moveBuilder(+x.dataset.bdown,'down'));document.getElementById('btestvoice').onclick=()=>{let b=builderDraft(),txt=voicePreview(b)[0]||'Тест голоса CF Coach';if(window.AndroidCoach)window.AndroidCoach.speak(txt)};document.getElementById('bstart').onclick=()=>{let b=builderDraft();if(!b.items.length)return;let cfg=buildTimerConfig(b);timer.mode=b.format;timer.total=cfg.totalSeconds||cfg.capSeconds||((cfg.workSeconds+cfg.restSeconds)*cfg.rounds);timer.remain=timer.total;timer.cycle=cfg.cycleSeconds||0;timer.prompts=cfg.roundPrompts||[];timer.label=b.name;tab='timer';render();setTimeout(()=>startTimer(cfg),120)};document.getElementById('bsave').onclick=()=>{let arr=builderTemplates(),b=builderDraft();arr.unshift(JSON.parse(JSON.stringify(b)));jset(BTEMPL,arr.slice(0,20));render()};document.getElementById('bclear').onclick=()=>{saveBuilderDraft({...defaultBuilder(),items:[]});render()};document.querySelectorAll('[data-bload]').forEach(x=>x.onclick=()=>{let arr=builderTemplates();saveBuilderDraft(arr[+x.dataset.bload]);render()});document.querySelectorAll('[data-bdel]').forEach(x=>x.onclick=()=>{let arr=builderTemplates();arr.splice(+x.dataset.bdel,1);jset(BTEMPL,arr);render()})}
function moveBuilder(i,what){let b=builderDraft();if(what==='remove')b.items.splice(i,1);if(what==='up'&&i>0)[b.items[i-1],b.items[i]]=[b.items[i],b.items[i-1]];if(what==='down'&&i<b.items.length-1)[b.items[i+1],b.items[i]]=[b.items[i],b.items[i+1]];saveBuilderDraft(b);render()}
function bindFood(){document.querySelectorAll('[data-foodtab]').forEach(x=>x.onclick=()=>{foodTab=x.dataset.foodtab;render()});let go=document.querySelector('[data-foodtabgo]');if(go)go.onclick=()=>{foodTab=go.dataset.foodtabgo;render()};document.querySelectorAll('[data-fooddate]').forEach(x=>x.onclick=()=>{foodDate=shiftDate(foodDate,+x.dataset.fooddate);render()});document.querySelectorAll('[data-fooddel]').forEach(x=>x.onclick=()=>{let d=foodDiary(),arr=d[foodDate]||[];d[foodDate]=arr.filter(e=>e.id!==x.dataset.fooddel);jset(FDIARY,d);render()});let c=document.getElementById('calc');if(c)c.onclick=calcFood;let cf=document.getElementById('foodcustom');if(cf)cf.onclick=customFoodModal;let rf=document.getElementById('recipefilter');if(rf)rf.onchange=()=>{document.getElementById('recipelist').innerHTML=recipeList(rf.value);document.querySelectorAll('[data-recipe]').forEach(x=>x.onclick=()=>recipeModal(x.dataset.recipe))};document.querySelectorAll('[data-recipe]').forEach(x=>x.onclick=()=>recipeModal(x.dataset.recipe))}
function bindTimer(){document.querySelectorAll('[data-tpreset]').forEach(b=>b.onclick=()=>{stopTimer();let [m,c,t]=b.dataset.tpreset.split('|');timer.mode=m;timer.cycle=+c;timer.total=+t;timer.remain=+t;timer.prompts=[];timer.label='';render()});document.getElementById('tstart').onclick=()=>timer.running?stopTimer(true):startTimer();document.getElementById('treset').onclick=()=>{stopTimer();timer.remain=timer.total;render()}}
function startTimer(customCfg){if(timer.running)return;timer.running=true;let cfg=customCfg||{mode:timer.mode,totalSeconds:timer.total,cycleSeconds:timer.cycle,workSeconds:20,restSeconds:10,rounds:8,voice:timer.voice,sound:timer.sound,roundPrompts:timer.prompts||[],startPrompt:timer.label||''};if(timer.mode==='TABATA'){cfg.mode='TABATA';cfg.workSeconds=20;cfg.restSeconds=10;cfg.rounds=8}if(window.AndroidCoach){cfg.elapsedOffset=Math.max(0,timer.total-timer.remain);window.AndroidCoach.startTimer(JSON.stringify(cfg))}timer.t=setInterval(()=>{timer.remain=Math.max(0,timer.remain-1);let e=document.getElementById('time');if(e)e.textContent=timerDisplay();let ring=document.getElementById('timerRing');if(ring)ring.style.setProperty('--pct',Math.round(100*timer.remain/Math.max(1,timer.total)));if(timer.remain<=0)stopTimer(true)},1000);render()}
function timerDisplay(){return timer.mode==='FORTIME'?fmt(timer.total-timer.remain):fmt(timer.remain)}
function stopTimer(r=false){timer.running=false;if(timer.t){clearInterval(timer.t);timer.t=null}if(window.AndroidCoach)try{window.AndroidCoach.stopTimer()}catch(e){}if(r)render()}function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function openSheet(){document.getElementById('modal').classList.add('open');let c=document.querySelector('#sheet .close');if(c)c.onclick=closeSheet}function closeSheet(){document.getElementById('modal').classList.remove('open')}
